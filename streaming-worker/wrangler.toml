name             = "ghost-streaming-worker"
main             = "build/worker/shim.mjs"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "worker-build --release"

# ── Durable Objects ────────────────────────────────────────────
[[durable_objects.bindings]]
name       = "RATE_LIMITER"
class_name = "SlidingWindowRateLimiter"

# مهم: new_sqlite_classes برای فعال‌سازی SQLite API
[[migrations]]
tag               = "v1"
new_sqlite_classes = ["SlidingWindowRateLimiter"]

# ── KV Namespace (Config) ─────────────────────────────────────
[[kv_namespaces]]
binding = "GHOST_CONFIG"
id      = "e9277d0612d04fae97e8d0d7ac6dc87d"

# ── Secrets (inject شده توسط wrangler یا GitHub Actions) ─────
# HMAC_SECRET — با `wrangler secret put HMAC_SECRET` تنظیم می‌شود
#
# ── /sub (اشتراک VLESS) ────────────────────────────────────────
# این worker سرور VLESS نیست؛ /sub فقط یک لینک استاندارد می‌سازد
# که به یک سرور VLESS واقعی اشاره می‌کند. تا وقتی مقادیر زیر تنظیم
# نشوند، /sub عمداً 503 می‌دهد (fail-closed) تا کلاینت لینک مرده
# import نکند.
#
#   wrangler secret put SUB_TOKEN     # >= 24 کاراکتر، تصادفی
#   wrangler secret put VLESS_UUID    # UUID کلاینت روی سرور VLESS
#   wrangler secret put VLESS_HOST    # دامنهٔ سرور VLESS، بدون scheme
#
# اختیاری (با `wrangler secret put` یا در [vars] زیر):
#   VLESS_PATH   = "/vless"    مسیر WebSocket
#   VLESS_SNI    = VLESS_HOST  پیش‌فرض
#   VLESS_REMARK = "SCP-GHOST" نام نمایشی نود
#
# ساخت توکن تصادفی:
#   openssl rand -hex 32

[vars]
WORKER_VERSION   = "5.2.1"
CONFIG_KV_KEY    = "routing_config"
RATE_LIMIT_RPM   = "500"
RATE_WINDOW_MS   = "60000"
