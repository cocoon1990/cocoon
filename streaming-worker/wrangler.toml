name             = "ghost-streaming-worker"
main             = "build/worker/shim.mjs"
compatibility_date = "2025-10-01"
# compatibility_flags = ["nodejs_compat"]
# ↑ عمداً خاموش است. هر buildی که با این فلگ روی Mainnet رفت 1101 داد،
#   در حالی که همان wasm بدون فلگ (و بدون binding) ۲۰۰ برگرداند.

[build]
command = "worker-build --release"

# ── Bindings ─────────────────────────────────────────────────
# در v5.4.1 هیچ binding ای تعریف نمی‌شود: هر binding روی این worker با
# 1101 روی Mainnet همراه بود. کد به‌صورت fail-open کار می‌کند:
#   • rate limiter  → بدون RATE_LIMITER محدودیتی اعمال نمی‌شود (لاگ می‌زند)
#   • /sub          → SUB_TOKEN و VLESS_UUID از secret خوانده می‌شوند
#                     (read_setting: secret → var)
# اگر بعداً binding لازم شد، اول روی یک worker آزمایشی تست کنید.

# ── Secrets (inject شده توسط wrangler یا GitHub Actions) ─────
# HMAC_SECRET — با `wrangler secret put HMAC_SECRET` تنظیم می‌شود
#
# ── VLESS Server (Cocoon in Cocoon) ───────────────────────────
# از v5.4.1 سرور VLESS یک worker مستقل و **فقط-JS** است
# (`ghost-vless-worker`، wrangler.vless.toml) چون هر ماژولی که کد
# WebSocket را داخل wasm داشته باشد روی Mainnet با 1101 می‌میرد.
# این worker فقط /health، /sub و /stream را سرو می‌کند و /sub لینکی
# می‌سازد که به همان worker VLESS اشاره می‌کند.
#
#   wrangler secret put SUB_TOKEN     # >= 24 کاراکتر، تصادفی
#   wrangler secret put VLESS_UUID    # UUID کلاینت = رمز تونل
#
# اختیاری (با `wrangler secret put` یا در [vars] زیر):
#   VLESS_HOST   = دامنهٔ اختصاصی جلو‌ی worker (پیش‌فرض: دامنهٔ درخواست)
#   VLESS_PATH   = "/vless"    مسیر WebSocket
#   VLESS_SNI    = همان host   پیش‌فرض
#   VLESS_REMARK = "SCP-GHOST" نام نمایشی نود
#
# ساخت توکن و UUID:
#   openssl rand -hex 32
#   uuidgen

[vars]
WORKER_VERSION   = "5.4.1"
# میزبان worker VLESS که /sub باید در لینک اشتراک بنویسد.
VLESS_HOST       = "ghost-vless-worker.cocoon-de9.workers.dev"
VLESS_SNI        = "ghost-vless-worker.cocoon-de9.workers.dev"
CONFIG_KV_KEY    = "routing_config"
RATE_LIMIT_RPM   = "500"
RATE_WINDOW_MS   = "60000"
