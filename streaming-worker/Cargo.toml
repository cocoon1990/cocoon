[package]
name         = "ghost-streaming-worker"
version      = "5.4.0"
edition      = "2021"
rust-version = "1.91"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker      = { version = "0.8.7", features = ["d1"] }
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
hex         = "0.4"
base64      = "0.22"
hmac        = "0.12"
sha2        = "0.10"
# ── VLESS over WebSocket (پمپ دوطرفه) ─────────────────────────
futures-util = "0.3"

[profile.release]
opt-level     = "z"
lto           = "fat"
codegen-units = 1
panic         = "abort"
