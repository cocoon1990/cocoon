[package]
name         = "ghost-signaling-worker"
version      = "5.1.1"
edition      = "2021"
rust-version = "1.91"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker      = { version = "0.8.7", features = ["d1"] }
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"

# ── رمزنگاری تبادل کلید (X25519 + HKDF + AES-GCM) ──────────────
# static_secrets برای StaticSecret::from([u8;32]) لازم است؛
# بدون آن فقط EphemeralSecret در دسترس است و نمی‌توانیم seed را
# از getRandomValues بگیریم.
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf         = "0.12"
sha2         = "0.10"
aes-gcm      = "0.10"
base64       = "0.22"
hex          = "0.4"
# js feature → crypto.getRandomValues در workerd
getrandom    = { version = "0.2", features = ["js"] }

[profile.release]
opt-level     = "z"
lto           = "fat"
codegen-units = 1
panic         = "abort"
