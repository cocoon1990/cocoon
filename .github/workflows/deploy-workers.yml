# ══════════════════════════════════════════════════════════════
#  SCP-GHOST Worker Deploy Pipeline
#
#  Builds streaming-worker و signaling-worker در Rust
#  و آن‌ها را با Wrangler به Cloudflare Edge deploy می‌کند.
#  فقط وقتی کد Worker یا خود این ورکفلو تغییر کند اجرا می‌شود.
# ══════════════════════════════════════════════════════════════
name: "⚙️ Build & Deploy — Rust Workers"

on:
  # ── اجرای دستی ────────────────────────────────────────────────
  # اولین trigger در بلوک on — همیشه در دسترس است، حتی وقتی
  # paths filter با هیچ تغییری match نشود.
  workflow_dispatch:
    inputs:
      worker:
        description: "Which worker to deploy"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - streaming
          - signaling

  # ── اجرای خودکار روی main ─────────────────────────────────────
  push:
    branches:
      - main
    paths:
      - "streaming-worker/**"
      - "signaling-worker/**"
      # تغییر در خودِ این ورکفلو هم باید اجرا را trigger کند،
      # وگرنه اصلاحات CI هرگز خودشان تست نمی‌شوند.
      - ".github/workflows/deploy-workers.yml"

concurrency:
  group: "ghost-worker-deploy-${{ github.ref }}"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # MSRV — worker 0.8.7 به Rust >= 1.91.0 نیاز دارد
  RUST_MIN_VERSION: "1.91.0"
  # worker-build باید هم‌نسخه با crate باشد
  WORKER_BUILD_VERSION: "0.8.7"

jobs:
  # ════════════════════════════════════════════════════════════
  #  Build و Deploy: Streaming Worker
  # ════════════════════════════════════════════════════════════
  deploy-streaming:
    name: "🦀 Streaming Worker — Build & Deploy"
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.worker == 'both' ||
      github.event.inputs.worker == 'streaming'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Rust Toolchain ─────────────────────────────────────
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # ── MSRV Gate ──────────────────────────────────────────
      # worker 0.8.7 به Rust >= 1.91.0 نیاز دارد. اگر toolchain
      # قدیمی‌تر باشد، بیلد در ادامه با خطای گیج‌کننده شکست می‌خورد؛
      # پس همین‌جا صریح fail می‌کنیم.
      - name: "Guard: verify rustc >= ${{ env.RUST_MIN_VERSION }}"
        run: |
          rustc --version
          ACTUAL=$(rustc --version | awk '{print $2}')
          REQUIRED="${{ env.RUST_MIN_VERSION }}"
          LOWEST=$(printf '%s\n%s\n' "$ACTUAL" "$REQUIRED" | sort -V | head -1)
          if [ "$LOWEST" != "$REQUIRED" ]; then
            echo "❌ rustc $ACTUAL is older than required $REQUIRED"
            echo "   worker 0.8.7 requires rust-version = $REQUIRED"
            exit 1
          fi
          echo "✅ rustc $ACTUAL >= $REQUIRED"

      # ── Cache ──────────────────────────────────────────────
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "streaming-worker -> target"
          key: "streaming-worker-${{ hashFiles('streaming-worker/Cargo.lock') }}"

      # ── Node.js + worker-build ─────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── worker-build (fast path) ───────────────────────────
      # worker-build در رجیستری taiki-e/install-action وجود ندارد
      # (آن action فقط ~۱۰۳ ابزار را می‌شناسد) و Cloudflare هم باینری
      # prebuilt منتشر نمی‌کند. بنابراین سه لایه سرعت‌دهی:
      #   ۱) کش باینری آماده با actions/cache  → اجراهای بعدی: چند ثانیه
      #   ۲) cargo-binstall (باینری آماده از quickinstall، اگر موجود باشد)
      #   ۳) cargo install  → فقط اولین اجرا / وقتی کش miss شود
      - name: Cache worker-build binary
        id: wb-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-${{ env.WORKER_BUILD_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-binstall (prebuilt, seconds)
        if: steps.wb-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install worker-build ${{ env.WORKER_BUILD_VERSION }}
        run: |
          VER="${{ env.WORKER_BUILD_VERSION }}"
          BIN="$HOME/.cargo/bin/worker-build"

          verify() {
            [ -x "$BIN" ] || return 1
            local v
            v=$("$BIN" --version | tr -d '[:space:]' | sed 's/^v//')
            [ "$v" = "$VER" ] || { echo "  found $v, want $VER"; return 1; }
          }

          if verify; then
            echo "✅ worker-build $VER restored from cache ($( "$BIN" --version ))"
            exit 0
          fi

          # ۲) باینری آماده — چند ثانیه (بدون کامپایل)
          if command -v cargo-binstall >/dev/null 2>&1; then
            echo "⬇️  trying cargo-binstall (prebuilt binary)..."
            if cargo-binstall binstall --no-confirm --force "worker-build@${VER}" && verify; then
              echo "✅ worker-build $VER installed from prebuilt binary"
              exit 0
            fi
            echo "⚠️  cargo-binstall could not provide a prebuilt binary — falling back to source build"
          fi

          # ۳) ساخت از سورس — کند (~۴ دقیقه)، فقط وقتی لازم است
          echo "🔨 building worker-build $VER from source..."
          cargo install worker-build --version "$VER"
          if ! verify; then
            echo "❌ worker-build $VER not installed correctly"
            exit 1
          fi
          echo "✅ worker-build $VER built from source"

      # ── Build ──────────────────────────────────────────────
      - name: Build streaming-worker (Rust → Wasm)
        working-directory: streaming-worker
        run: |
          echo "🔨 Building streaming-worker in release mode..."
          worker-build --release
          echo ""
          echo "📦 Build output (build/ tree):"
          find build -maxdepth 2 -type f | sort
          echo ""
          echo "📊 Wasm artifact(s):"
          find build -type f -name '*.wasm' -exec ls -lh {} \;

      # ── CRITICAL GUARD ─────────────────────────────────────
      # Cloudflare فقط WebAssembly می‌پذیرد — هرگز کد Rust خام.
      # این step تضمین می‌کند worker-build --release واقعاً اجرا شده،
      # فایل .wasm ساخته شده، و entrypoint اعلام‌شده در wrangler.toml موجود است.
      - name: "Guard: verify compiled Wasm artifacts (raw .rs is never uploaded)"
        working-directory: streaming-worker
        run: |
          echo "🔍 Verifying worker-build output (Rust → Wasm)..."

          # ── ۱) artifact .wasm — جست‌وجوی مستقل از layout زیر build/ ──
          # توجه: worker-build 0.8.7 باینری را در build/<out_name>_bg.wasm
          # می‌نویسد (یعنی build/index_bg.wasm) — نه داخل build/worker/.
          # build/worker/shim.mjs فقط یک re-export به ../index.js است.
          WASM_FILES=$(find build -type f -name '*.wasm')
          if [ -z "$WASM_FILES" ]; then
            echo "❌ No .wasm artifact found anywhere under build/"
            echo "   Cloudflare only accepts WebAssembly — refusing to deploy raw Rust"
            exit 1
          fi
          echo "✅ Compiled Wasm artifact(s):"
          for f in $WASM_FILES; do
            ls -lh "$f"
            [ -s "$f" ] || { echo "❌ Empty wasm file: $f"; exit 1; }
          done

          # ── ۲) entrypoint اعلام‌شده در wrangler.toml باید وجود داشته باشد ──
          MAIN_PATH=$(python3 -c "import tomllib; print(tomllib.load(open('wrangler.toml','rb'))['main'])" 2>/dev/null \
            || grep -m1 -E '^[[:space:]]*main[[:space:]]*=' wrangler.toml | sed -E 's/^[^=]*=[[:space:]]*//; s/^"//; s/"[[:space:]]*$//')
          echo "🔗 wrangler.toml main = ${MAIN_PATH}"
          if [ ! -f "$MAIN_PATH" ]; then
            echo "❌ wrangler.toml 'main' points to a missing file: ${MAIN_PATH}"
            exit 1
          fi
          echo "✅ wrangler entrypoint present — ready for wrangler deploy"

      # ── Provisions: VLESS_UUID + SUB_TOKEN ─────────────────
      # بدون این دو secret، /sub عمداً 503 می‌دهد (fail-closed) و کاربر
      # هیچ لینک اشتراکی ندارد. مقدارها به‌صورت قطعی از HMAC_SECRET مشتق
      # می‌شوند تا نیازی به secret جدید نباشد و در هر دیپلوی ثابت بمانند
      # (چرخش HMAC_SECRET = چرخش UUID، که همان رفتار دلخواه است).
      - name: Derive VLESS credentials
        id: vless
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
        run: |
          set -u
          if [ -z "${HMAC_SECRET:-}" ]; then
            echo "::error title=VLESS::HMAC_SECRET is not set — /sub would stay disabled"
            exit 1
          fi
          OUT=$(python3 - <<'PY'
          import hashlib, hmac, os
          secret = os.environ["HMAC_SECRET"].encode()
          raw = bytearray(hmac.new(secret, b"scp-ghost/vless-uuid/v1", hashlib.sha256).digest()[:16])
          raw[6] = (raw[6] & 0x0F) | 0x40   # version 4
          raw[8] = (raw[8] & 0x3F) | 0x80   # RFC 4122 variant
          h = raw.hex()
          uuid = f"{h[0:8]}-{h[8:12]}-{h[12:16]}-{h[16:20]}-{h[20:32]}"
          token = hmac.new(secret, b"scp-ghost/sub-token/v1", hashlib.sha256).hexdigest()
          print(uuid)
          print(token)
          PY
          )
          UUID=$(printf '%s' "$OUT" | sed -n 1p)
          TOKEN=$(printf '%s' "$OUT" | sed -n 2p)
          echo "::add-mask::$TOKEN"
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$TOKEN" >> /dev/null
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "uuid tail: ${UUID: -4}"

      # ── Deploy ─────────────────────────────────────────────
      # عمداً با `npx wrangler@latest` و نه wrangler-action: تنها دیپلوی‌هایی
      # که روی Mainnet ۲۰۰ دادند با همین wrangler انجام شدند؛ اکشن با
      # wrangler قدیمی‌ترش باندل متفاوتی می‌سازد که 1101 می‌دهد.
      - name: Deploy streaming-worker to Cloudflare Edge
        working-directory: streaming-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -u
          if ! npx --yes wrangler@latest deploy > /tmp/deploy.log 2>&1; then
            MSG=$(tail -n 15 /tmp/deploy.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS=""} {print (NR>1 ? "%0A" : "") $0}' | cut -c1-900)
            echo "::error title=streaming deploy::$MSG"
            exit 1
          fi
          tail -n 10 /tmp/deploy.log

      - name: Upload the worker secrets
        working-directory: streaming-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
          VLESS_UUID: ${{ steps.vless.outputs.uuid }}
          SUB_TOKEN: ${{ steps.vless.outputs.token }}
        run: |
          set -u
          for name in HMAC_SECRET VLESS_UUID SUB_TOKEN; do
            value=$(eval "printf '%s' \"\$$name\"")
            if [ -z "$value" ]; then echo "::warning title=secret::$name is empty"; continue; fi
            if printf '%s' "$value" | npx --yes wrangler@latest secret put "$name" >/tmp/secret-$name.log 2>&1; then
              echo "✅ $name"
            else
              MSG=$(tail -n 6 /tmp/secret-$name.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS=""} {print (NR>1 ? "%0A" : "") $0}' | cut -c1-500)
              echo "::error title=secret $name::$MSG"
              exit 1
            fi
          done

      # ── Deploy the standalone JS VLESS worker ──────────────
      # صفر wasm، صفر binding: فقط WebSocketPair + cloudflare:sockets.
      # همان UUID مشتق‌شده تا کلید دو worker یکی باشد.
      - name: Deploy the JS VLESS worker
        working-directory: streaming-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VLESS_UUID: ${{ steps.vless.outputs.uuid }}
        run: |
          set -u
          if ! npx --yes wrangler@latest deploy -c wrangler.vless.toml > /tmp/vless-deploy.log 2>&1; then
            MSG=$(tail -n 15 /tmp/vless-deploy.log | cut -c1-200)
            MSG2=$(sed -e 's/%/%25/g' "$MSG" | awk 'BEGIN{ORS=""} {print (NR>1 ? "%0A" : "") $0}')
            echo "::error title=VLESS worker deploy::$MSG2"
            tail -n 15 /tmp/vless-deploy.log
            exit 1
          fi
          tail -n 12 /tmp/vless-deploy.log
          printf '%s' "$VLESS_UUID" | npx --yes wrangler@latest secret put VLESS_UUID -c wrangler.vless.toml >/dev/null 2>&1 \
            || echo "::warning title=VLESS secret::could not set VLESS_UUID"
          echo "✅ ghost-vless-worker deployed"

      # ── Health Check بعد از Deploy ─────────────────────────
      - name: Post-deploy health check
        env:
          HEALTH_URL: ${{ secrets.CF_STREAMING_URL }}
        run: |
          # ── گارد: اگر secret تنظیم نشده باشد، اجرا نباید fail شود ──
          # secret تنظیم‌نشده در GitHub Actions به رشتهٔ خالی تبدیل می‌شود؛
          # مقدار placeholder هم معمولاً شامل '?' است.
          if [ -z "${HEALTH_URL}" ] || printf '%s' "${HEALTH_URL}" | grep -q '?'; then
            echo "::warning::CF_STREAMING_URL is not set. Skipping health check."
            exit 0
          fi

          URL="${HEALTH_URL%/}/health"
          echo "🔬 Health check target: $URL"

          # ── retry: تا ۳ تلاش با فاصلهٔ ۱۰ ثانیه ──
          MAX_ATTEMPTS=3
          RETRY_DELAY=10
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "── attempt $attempt/$MAX_ATTEMPTS ──"
            # -s silent, -S show errors, --max-time 15, -w status code
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$URL" --max-time 15 2>/tmp/curl_err) && CURL_RC=0 || CURL_RC=$?
            STATUS="${STATUS:-000}"

            if [ "$CURL_RC" -eq 0 ] && [ "$STATUS" = "200" ]; then
              echo "✅ Streaming Worker is healthy (HTTP 200)"
              exit 0
            fi

            if [ "$CURL_RC" -ne 0 ]; then
              case "$CURL_RC" in
                6)  echo "   curl exit 6: could not resolve host (DNS) — secret may point to a non-existent host" ;;
                7)  echo "   curl exit 7: failed to connect" ;;
                28) echo "   curl exit 28: timeout" ;;
                *)  echo "   curl exit $CURL_RC: $(head -1 /tmp/curl_err 2>/dev/null || echo 'unknown error')" ;;
              esac
            else
              echo "   HTTP $STATUS"
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "   retrying in ${RETRY_DELAY}s..."
              sleep "$RETRY_DELAY"
            fi
          done

          # ── HARD GATE (v5.4.1+) ────────────────────────────────
          # تا v5.4.0 این مرحله فقط warning می‌داد و در نتیجه یک worker
          # مرده (1101) با وضعیت سبز منتشر شد. از این نسخه، اگر worker
          # بعد از سه تلاش جواب ندهد، دیپلوی قرمز است.
          echo "::error title=Health check failed::$URL did not return HTTP 200 after $MAX_ATTEMPTS attempts (last: HTTP $STATUS, curl rc $CURL_RC)."
          exit 1

      # ── لینک اشتراک آماده (برای کاربر / خلاصهٔ اجرا) ──────────
      - name: Publish the subscription URL
        env:
          HEALTH_URL: ${{ secrets.CF_STREAMING_URL }}
          TOKEN: ${{ steps.vless.outputs.token }}
          UUID: ${{ steps.vless.outputs.uuid }}
        run: |
          set -u
          if [ -z "${HEALTH_URL:-}" ]; then echo "no CF_STREAMING_URL"; exit 0; fi
          BASE="${HEALTH_URL%/}"
          SUB="$BASE/sub?token=$TOKEN"
          {
            echo "### 🔗 لینک اشتراک VLESS"
            echo ''
            echo '```'
            echo "$SUB"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=subscription::$SUB"
          echo "::notice title=node::$UUID @ $(echo "$BASE" | sed -E 's#https?://##') :443 ws /vless"

      # ── VLESS زنده است؟ (GET بدون Upgrade باید 426 بدهد) ──────
      - name: "VLESS endpoint live (GET /vless without upgrade → 426)"
        env:
          HEALTH_URL: ${{ secrets.CF_STREAMING_URL }}
        run: |
          set -u
          if [ -z "${HEALTH_URL:-}" ]; then
            echo "::warning::CF_STREAMING_URL is not set. Skipping VLESS check."
            exit 0
          fi
          # worker مستقل VLESS (نه worker اصلی)
          SUBDOMAIN=$(python3 -c "import os,urllib.parse as u;h=u.urlparse(os.environ['HEALTH_URL']).hostname or '';print(h.split('.',1)[1] if '.' in h else '')")
          URL="https://ghost-vless-worker.${SUBDOMAIN}/vless"
          CODE=000
          for attempt in 1 2 3; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$URL" || echo 000)
            [ "$CODE" = "426" ] && break
            sleep 10
          done
          echo "GET /vless -> $CODE"
          [ "$CODE" = "426" ] || { echo "::error title=VLESS check failed::GET /vless returned $CODE (expected 426)"; exit 1; }
          echo "✅ VLESS-over-WebSocket is served (upgrade required)"

  # ════════════════════════════════════════════════════════════
  #  Build و Deploy: Signaling Worker
  # ════════════════════════════════════════════════════════════
  deploy-signaling:
    name: "📡 Signaling Worker — Build & Deploy"
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.worker == 'both' ||
      github.event.inputs.worker == 'signaling'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: "Guard: verify rustc >= ${{ env.RUST_MIN_VERSION }}"
        run: |
          rustc --version
          ACTUAL=$(rustc --version | awk '{print $2}')
          REQUIRED="${{ env.RUST_MIN_VERSION }}"
          LOWEST=$(printf '%s\n%s\n' "$ACTUAL" "$REQUIRED" | sort -V | head -1)
          if [ "$LOWEST" != "$REQUIRED" ]; then
            echo "❌ rustc $ACTUAL is older than required $REQUIRED"
            exit 1
          fi
          echo "✅ rustc $ACTUAL >= $REQUIRED"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "signaling-worker -> target"
          key: "signaling-worker-${{ hashFiles('signaling-worker/Cargo.lock') }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── worker-build (fast path) ───────────────────────────
      # worker-build در رجیستری taiki-e/install-action وجود ندارد
      # (آن action فقط ~۱۰۳ ابزار را می‌شناسد) و Cloudflare هم باینری
      # prebuilt منتشر نمی‌کند. بنابراین سه لایه سرعت‌دهی:
      #   ۱) کش باینری آماده با actions/cache  → اجراهای بعدی: چند ثانیه
      #   ۲) cargo-binstall (باینری آماده از quickinstall، اگر موجود باشد)
      #   ۳) cargo install  → فقط اولین اجرا / وقتی کش miss شود
      - name: Cache worker-build binary
        id: wb-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-${{ env.WORKER_BUILD_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-binstall (prebuilt, seconds)
        if: steps.wb-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install worker-build ${{ env.WORKER_BUILD_VERSION }}
        run: |
          VER="${{ env.WORKER_BUILD_VERSION }}"
          BIN="$HOME/.cargo/bin/worker-build"

          verify() {
            [ -x "$BIN" ] || return 1
            local v
            v=$("$BIN" --version | tr -d '[:space:]' | sed 's/^v//')
            [ "$v" = "$VER" ] || { echo "  found $v, want $VER"; return 1; }
          }

          if verify; then
            echo "✅ worker-build $VER restored from cache ($( "$BIN" --version ))"
            exit 0
          fi

          # ۲) باینری آماده — چند ثانیه (بدون کامپایل)
          if command -v cargo-binstall >/dev/null 2>&1; then
            echo "⬇️  trying cargo-binstall (prebuilt binary)..."
            if cargo-binstall binstall --no-confirm --force "worker-build@${VER}" && verify; then
              echo "✅ worker-build $VER installed from prebuilt binary"
              exit 0
            fi
            echo "⚠️  cargo-binstall could not provide a prebuilt binary — falling back to source build"
          fi

          # ۳) ساخت از سورس — کند (~۴ دقیقه)، فقط وقتی لازم است
          echo "🔨 building worker-build $VER from source..."
          cargo install worker-build --version "$VER"
          if ! verify; then
            echo "❌ worker-build $VER not installed correctly"
            exit 1
          fi
          echo "✅ worker-build $VER built from source"

      - name: Build signaling-worker (Rust → Wasm)
        working-directory: signaling-worker
        run: |
          echo "🔨 Building signaling-worker in release mode..."
          worker-build --release
          echo "📦 Build output (build/ tree):"
          find build -maxdepth 2 -type f | sort

      # ── CRITICAL GUARD ─────────────────────────────────────
      # Cloudflare فقط WebAssembly می‌پذیرد — هرگز کد Rust خام.
      # این step تضمین می‌کند worker-build --release واقعاً اجرا شده،
      # فایل .wasm ساخته شده، و entrypoint اعلام‌شده در wrangler.toml موجود است.
      - name: "Guard: verify compiled Wasm artifacts (raw .rs is never uploaded)"
        working-directory: signaling-worker
        run: |
          echo "🔍 Verifying worker-build output (Rust → Wasm)..."

          # ── ۱) artifact .wasm — جست‌وجوی مستقل از layout زیر build/ ──
          # توجه: worker-build 0.8.7 باینری را در build/<out_name>_bg.wasm
          # می‌نویسد (یعنی build/index_bg.wasm) — نه داخل build/worker/.
          # build/worker/shim.mjs فقط یک re-export به ../index.js است.
          WASM_FILES=$(find build -type f -name '*.wasm')
          if [ -z "$WASM_FILES" ]; then
            echo "❌ No .wasm artifact found anywhere under build/"
            echo "   Cloudflare only accepts WebAssembly — refusing to deploy raw Rust"
            exit 1
          fi
          echo "✅ Compiled Wasm artifact(s):"
          for f in $WASM_FILES; do
            ls -lh "$f"
            [ -s "$f" ] || { echo "❌ Empty wasm file: $f"; exit 1; }
          done

          # ── ۲) entrypoint اعلام‌شده در wrangler.toml باید وجود داشته باشد ──
          MAIN_PATH=$(python3 -c "import tomllib; print(tomllib.load(open('wrangler.toml','rb'))['main'])" 2>/dev/null \
            || grep -m1 -E '^[[:space:]]*main[[:space:]]*=' wrangler.toml | sed -E 's/^[^=]*=[[:space:]]*//; s/^"//; s/"[[:space:]]*$//')
          echo "🔗 wrangler.toml main = ${MAIN_PATH}"
          if [ ! -f "$MAIN_PATH" ]; then
            echo "❌ wrangler.toml 'main' points to a missing file: ${MAIN_PATH}"
            exit 1
          fi
          echo "✅ wrangler entrypoint present — ready for wrangler deploy"

      - name: Deploy signaling-worker to Cloudflare Edge
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: deploy
          workingDirectory: signaling-worker
          secrets: |
            HMAC_SECRET
            GHOST_RELOAD_TOKEN
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
          GHOST_RELOAD_TOKEN: ${{ secrets.GHOST_RELOAD_TOKEN }}

      - name: Post-deploy health check
        env:
          HEALTH_URL: ${{ secrets.CF_SIGNALING_URL }}
        run: |
          # ── گارد: اگر secret تنظیم نشده باشد، اجرا نباید fail شود ──
          # secret تنظیم‌نشده در GitHub Actions به رشتهٔ خالی تبدیل می‌شود؛
          # مقدار placeholder هم معمولاً شامل '?' است.
          if [ -z "${HEALTH_URL}" ] || printf '%s' "${HEALTH_URL}" | grep -q '?'; then
            echo "::warning::CF_SIGNALING_URL is not set. Skipping health check."
            exit 0
          fi

          URL="${HEALTH_URL%/}/health"
          echo "🔬 Health check target: $URL"

          # ── retry: تا ۳ تلاش با فاصلهٔ ۱۰ ثانیه ──
          MAX_ATTEMPTS=3
          RETRY_DELAY=10
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "── attempt $attempt/$MAX_ATTEMPTS ──"
            # -s silent, -S show errors, --max-time 15, -w status code
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$URL" --max-time 15 2>/tmp/curl_err) && CURL_RC=0 || CURL_RC=$?
            STATUS="${STATUS:-000}"

            if [ "$CURL_RC" -eq 0 ] && [ "$STATUS" = "200" ]; then
              echo "✅ Signaling Worker is healthy (HTTP 200)"
              exit 0
            fi

            if [ "$CURL_RC" -ne 0 ]; then
              case "$CURL_RC" in
                6)  echo "   curl exit 6: could not resolve host (DNS) — secret may point to a non-existent host" ;;
                7)  echo "   curl exit 7: failed to connect" ;;
                28) echo "   curl exit 28: timeout" ;;
                *)  echo "   curl exit $CURL_RC: $(head -1 /tmp/curl_err 2>/dev/null || echo 'unknown error')" ;;
              esac
            else
              echo "   HTTP $STATUS"
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "   retrying in ${RETRY_DELAY}s..."
              sleep "$RETRY_DELAY"
            fi
          done

          # ── HARD GATE (v5.4.1+) ────────────────────────────────
          # تا v5.4.0 این مرحله فقط warning می‌داد و در نتیجه یک worker
          # مرده (1101) با وضعیت سبز منتشر شد. از این نسخه، اگر worker
          # بعد از سه تلاش جواب ندهد، دیپلوی قرمز است.
          echo "::error title=Health check failed::$URL did not return HTTP 200 after $MAX_ATTEMPTS attempts (last: HTTP $STATUS, curl rc $CURL_RC)."
          exit 1

      # ── لینک اشتراک آماده (برای کاربر / خلاصهٔ اجرا) ──────────
      - name: Publish the subscription URL
        env:
          HEALTH_URL: ${{ secrets.CF_STREAMING_URL }}
          TOKEN: ${{ steps.vless.outputs.token }}
          UUID: ${{ steps.vless.outputs.uuid }}
        run: |
          set -u
          if [ -z "${HEALTH_URL:-}" ]; then echo "no CF_STREAMING_URL"; exit 0; fi
          BASE="${HEALTH_URL%/}"
          SUB="$BASE/sub?token=$TOKEN"
          {
            echo "### 🔗 لینک اشتراک VLESS"
            echo ''
            echo '```'
            echo "$SUB"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=subscription::$SUB"
          echo "::notice title=node::$UUID @ $(echo "$BASE" | sed -E 's#https?://##') :443 ws /vless"

      # ── VLESS زنده است؟ (GET بدون Upgrade باید 426 بدهد) ──────
      - name: "VLESS endpoint live (GET /vless without upgrade → 426)"
        env:
          HEALTH_URL: ${{ secrets.CF_STREAMING_URL }}
        run: |
          set -u
          if [ -z "${HEALTH_URL:-}" ]; then
            echo "::warning::CF_STREAMING_URL is not set. Skipping VLESS check."
            exit 0
          fi
          URL="${HEALTH_URL%/}/vless"
          CODE=000
          for attempt in 1 2 3; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$URL" || echo 000)
            [ "$CODE" = "426" ] && break
            sleep 10
          done
          echo "GET /vless -> $CODE"
          [ "$CODE" = "426" ] || { echo "::error title=VLESS check failed::GET /vless returned $CODE (expected 426)"; exit 1; }
          echo "✅ VLESS-over-WebSocket is served (upgrade required)"

  # ════════════════════════════════════════════════════════════
  #  Summary Job
  # ════════════════════════════════════════════════════════════
  summary:
    name: "📋 Deployment Summary"
    runs-on: ubuntu-latest
    needs: [deploy-streaming, deploy-signaling]
    if: always()

    steps:
      - name: Print deployment summary
        run: |
          echo "══════════════════════════════════════════"
          echo "  SCP-GHOST Worker Deployment Summary"
          echo "══════════════════════════════════════════"
          echo "  Streaming : ${{ needs.deploy-streaming.result }}"
          echo "  Signaling : ${{ needs.deploy-signaling.result }}"
          echo "  Commit    : ${{ github.sha }}"
          echo "  Actor     : ${{ github.actor }}"
          echo "══════════════════════════════════════════"

          # اگر یکی از workers شکست خورد، job را fail کن
          if [ "${{ needs.deploy-streaming.result }}" = "failure" ] || \
             [ "${{ needs.deploy-signaling.result }}" = "failure" ]; then
            echo "❌ One or more deployments failed"
            exit 1
          fi
          echo "✅ All deployments succeeded"
