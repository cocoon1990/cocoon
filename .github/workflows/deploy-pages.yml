# ══════════════════════════════════════════════════════════════
#  SCP-GHOST Pages Deploy Pipeline
#
#  browser-wasm را با wasm-pack می‌سازد و همراه با
#  docs/sw.js و docs/index.html به GitHub Pages deploy می‌کند.
# ══════════════════════════════════════════════════════════════
name: "🌐 Build & Deploy — GitHub Pages"

on:
  # ── اجرای دستی ────────────────────────────────────────────────
  # اولین trigger در بلوک on — همیشه در دسترس است،
  # حتی وقتی paths filter با هیچ تغییری match نشود.
  workflow_dispatch:

  # ── اجرای خودکار روی main ─────────────────────────────────────
  push:
    branches:
      - main
    paths:
      - "browser-wasm/**"
      - "docs/**"
      # تغییر در خودِ این ورکفلو هم باید اجرا را trigger کند،
      # وگرنه اصلاحات CI هرگز خودشان تست نمی‌شوند.
      - ".github/workflows/deploy-pages.yml"

concurrency:
  group: "ghost-pages-deploy"
  cancel-in-progress: true

env:
  WASM_OUT_DIR: "docs/wasm"

jobs:
  build-and-deploy:
    name: "🦀 wasm-pack Build → GitHub Pages"
    runs-on: ubuntu-latest
    permissions:
      contents: write   # برای push به gh-pages branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Rust Toolchain ─────────────────────────────────────
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "browser-wasm -> target"
          key: "browser-wasm-${{ hashFiles('browser-wasm/Cargo.lock') }}"

      # ── wasm-pack ──────────────────────────────────────────
      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          echo "✅ wasm-pack: $(wasm-pack --version)"

      # ── Build ──────────────────────────────────────────────
      - name: Build browser-wasm (Rust → Wasm ES Module)
        working-directory: browser-wasm
        run: |
          echo "🔨 Building browser-wasm..."
          wasm-pack build \
            --target web \
            --release \
            --out-dir "../${{ env.WASM_OUT_DIR }}" \
            --out-name "ghost_wasm"

          echo ""
          echo "📦 Wasm output:"
          ls -lh "../${{ env.WASM_OUT_DIR }}/"
          echo ""
          WASM_SIZE=$(du -sh "../${{ env.WASM_OUT_DIR }}/ghost_wasm_bg.wasm" | awk '{print $1}')
          echo "📊 Wasm binary size: $WASM_SIZE"

      # ── Inject runtime config به sw.js ────────────────────
      # URL های Worker در زمان build به Service Worker تزریق می‌شوند
      # ══════════════════════════════════════════════════════════
      #  تزریق URLهای واقعی Worker در **هر دو** فایل:
      #    • docs/sw.js       → STREAMING_WORKER_URL و SIGNALING_WORKER_URL
      #    • docs/index.html  → SIGNALING_URL  (قبلاً از قلم افتاده بود
      #      و UI با placeholder «__CF_SIGNALING_URL__» به شبکه می‌رفت)
      #  اگر secret خالی/placeholder باشد، ورک‌فلو **fail** می‌شود تا
      #  هرگز سایتی با placeholder منتشر نشود.
      # ══════════════════════════════════════════════════════════
      - name: Inject Cloudflare endpoint URLs into docs
        env:
          CF_STREAMING_URL: ${{ secrets.CF_STREAMING_URL }}
          CF_SIGNALING_URL: ${{ secrets.CF_SIGNALING_URL }}
        run: |
          set -euo pipefail

          # ── ۱. اعتبارسنجی secretها ──────────────────────────
          check_secret() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error title=Missing secret::$name is empty or not set. Add it in Settings → Secrets and variables → Actions."
              exit 1
            fi
            if [[ "$value" == *"__"* ]]; then
              echo "::error title=Placeholder secret::$name still contains a __PLACEHOLDER__ ($value)"
              exit 1
            fi
            # باید https با host معتبر باشد؛ «https://?» رد می‌شود
            if [[ ! "$value" =~ ^https://[A-Za-z0-9._-]+(:[0-9]+)?(/[^[:space:]]*)?$ ]]; then
              echo "::error title=Invalid secret::$name is not a valid https URL (got: $value)"
              exit 1
            fi
          }

          check_secret "CF_STREAMING_URL" "${CF_STREAMING_URL:-}"
          check_secret "CF_SIGNALING_URL" "${CF_SIGNALING_URL:-}"

          # ── ۲. escape برای sed ──────────────────────────────
          # در replacement سمت sed، سه کاراکتر خاص‌اند: \ ، & و delimiter (|)
          sed_escape() { printf '%s' "$1" | sed -e 's/[\\|&]/\\&/g'; }
          STREAMING_ESC="$(sed_escape "$CF_STREAMING_URL")"
          SIGNALING_ESC="$(sed_escape "$CF_SIGNALING_URL")"

          # ── ۳. تزریق در هر دو فایل ──────────────────────────
          # (index.html فقط SIGNALING_URL دارد؛ sw.js هر دو را)
          for f in docs/index.html docs/sw.js; do
            if [ ! -f "$f" ]; then
              echo "::error title=Missing file::$f not found"
              exit 1
            fi
            sed -i \
              -e "s|__CF_STREAMING_URL__|${STREAMING_ESC}|g" \
              -e "s|__CF_SIGNALING_URL__|${SIGNALING_ESC}|g" \
              "$f"
            echo "✅ injected: $f"
          done

          # ── ۴. تأیید: هیچ placeholderی نباید باقی بماند ──────
          echo ""
          echo "🔎 Injected values:"
          grep -n "SIGNALING_URL" docs/index.html | head -3
          grep -n "STREAMING_WORKER_URL\|SIGNALING_WORKER_URL" docs/sw.js | head -3

          if grep -n '__CF_[A-Z_]*__' docs/index.html docs/sw.js; then
            echo "::error title=Placeholder left::__CF_* placeholders survived substitution"
            exit 1
          fi
          echo "✅ no __CF_* placeholders left in docs/"

      # ── حذف فایل‌های اضافی wasm-pack ─────────────────────
      - name: Clean up unnecessary wasm-pack artifacts
        run: |
          # package.json و README که wasm-pack تولید می‌کند لازم نیستند
          rm -f "${{ env.WASM_OUT_DIR }}/package.json"
          rm -f "${{ env.WASM_OUT_DIR }}/README.md"
          rm -f "${{ env.WASM_OUT_DIR }}/.gitignore"
          echo "✅ Cleaned wasm output directory"

      # ── تأیید فایل‌های نهایی ───────────────────────────────
      - name: Verify deployment artifacts
        run: |
          echo "📁 Final docs/ structure:"
          find docs/ -type f | sort
          echo ""
          echo "Required files check:"
          for f in "docs/index.html" "docs/sw.js" \
                   "docs/wasm/ghost_wasm.js" \
                   "docs/wasm/ghost_wasm_bg.wasm"; do
            if [ -f "$f" ]; then
              echo "  ✅ $f ($(du -sh $f | awk '{print $1}'))"
            else
              echo "  ❌ MISSING: $f"
              exit 1
            fi
          done

      # ── Deploy به GitHub Pages ─────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          commit_message: |
            deploy: SCP-GHOST Pages — ${{ github.sha }}

            Wasm: browser-wasm built with wasm-pack
            Trigger: ${{ github.event_name }}
            Actor: ${{ github.actor }}

      - name: Print deployment URL
        run: |
          REPO="${{ github.repository }}"
          OWNER="${REPO%%/*}"
          REPO_NAME="${REPO##*/}"
          echo "✅ Deployed to: https://${OWNER}.github.io/${REPO_NAME}/"
