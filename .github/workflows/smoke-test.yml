# ══════════════════════════════════════════════════════════════
#  Smoke Test — Deployed Streaming Worker
#
#  چرا این ورک‌فلو وجود دارد؟
#  ورک‌فلوی deploy-workers یک health check دارد که عمداً هرگز fail
#  نمی‌شود (failsafe برای propagation). یعنی هیچ تست واقعی روی
#  رفتار endpointهای مستقر وجود ندارد. این ورک‌فلو آن شکاف را
#  می‌بندد و *رفتار* (نه فقط build) را روی نسخهٔ مستقر بررسی می‌کند.
#
#  اجرا:
#    gh workflow run smoke-test.yml
#
#  هر بررسی یک step مستقل است، پس نتیجهٔ هرکدام در API قابل خواندن
#  است (conclusion هر step) حتی وقتی لاگ قابل دانلود نباشد.
#
#  نکتهٔ امنیتی: مسیرها هرگز echo نمی‌شوند چون query آن‌ها شامل
#  امضای HMAC است. فقط status code و هدرهای غیرحساس چاپ می‌شوند.
# ══════════════════════════════════════════════════════════════
name: "🧪 Smoke Test — Deployed Worker"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: "🌐 Live endpoint behaviour"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # secret اختیاری؛ اگر تنظیم نشده باشد از URL داخل config استفاده می‌شود
      CF_STREAMING_URL: ${{ secrets.CF_STREAMING_URL }}
      HMAC_SECRET: ${{ secrets.HMAC_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── resolve base URL ────────────────────────────────────
      - name: Resolve worker base URL
        run: |
          BASE="${CF_STREAMING_URL}"
          if [ -z "$BASE" ]; then
            BASE=$(python3 -c "import json;print(json.load(open('config/ghost-routing-config.json'))['endpoints']['cloudflare_stream_worker'])")
            echo "::notice::CF_STREAMING_URL is not set — falling back to config endpoint"
          fi
          BASE="${BASE%/}"
          if [ -z "$BASE" ]; then
            echo "::error::could not resolve a worker base URL"
            exit 1
          fi
          echo "GHOST_BASE=$BASE" >> "$GITHUB_ENV"
          echo "base host resolved: $(printf '%s' "$BASE" | sed -E 's#^https?://##; s#/.*##')"

      # ── ۱. /health ──────────────────────────────────────────
      - name: "Health: GET /health → 200 + ghost-streaming"
        run: |
          CODE=$(curl -sS -o body.json -w '%{http_code}' --max-time 20 "$GHOST_BASE/health" || echo 000)
          echo "status=$CODE"
          cat body.json 2>/dev/null || true
          echo
          [ "$CODE" = "200" ] || { echo "::error::/health returned $CODE"; exit 1; }
          grep -q '"worker":"ghost-streaming"' body.json || { echo "::error::/health body is not the streaming worker"; exit 1; }
          grep -q '"version"' body.json || { echo "::error::/health has no version field"; exit 1; }

      # ── ۲. /sub — وجود مسیر و دروازهٔ امنیتی ────────────────
      - name: "Sub: route exists and is gated (X-Ghost-Sub)"
        run: |
          CODE=$(curl -sS -D headers.txt -o body.txt -w '%{http_code}' --max-time 20 "$GHOST_BASE/sub" || echo 000)
          echo "status=$CODE"
          grep -i '^x-ghost-sub:' headers.txt || true
          GATE=$(grep -i '^x-ghost-sub:' headers.txt | tr -d '\r' | awk '{print $2}' | tr 'A-Z' 'a-z' || true)

          case "$GATE" in
            unconfigured|token-required|ok) ;;
            *) echo "::error::/sub is missing or not gated (X-Ghost-Sub=$GATE)"; exit 1 ;;
          esac

          case "$GATE" in
            ok)
              [ "$CODE" = "200" ] || { echo "::error::gate=ok but status=$CODE"; exit 1; }
              # بدنه باید Base64 معتبر از یک URI وی‌لِس باشد
              base64 -d body.txt > decoded.txt 2>/dev/null || { echo "::error::body is not valid base64"; exit 1; }
              head -c 8 decoded.txt | grep -q '^vless://' || { echo "::error::decoded subscription is not a vless URI"; exit 1; }
              grep -q 'security=tls' decoded.txt || { echo "::error::subscription has no TLS"; exit 1; }
              grep -q ':443' decoded.txt || { echo "::error::subscription is not on port 443"; exit 1; }
              echo "✅ subscription is valid base64(vless://…:443, tls)"
              ;;
            token-required)
              [ "$CODE" = "403" ] || { echo "::error::expected 403 for missing token, got $CODE"; exit 1; }
              ;;
            unconfigured)
              [ "$CODE" = "503" ] || { echo "::error::expected 503 while unconfigured, got $CODE"; exit 1; }
              grep -q 'subscription_not_configured' body.txt || { echo "::error::503 body lacks subscription_not_configured"; exit 1; }
              echo "✅ /sub exists and refuses to emit a link until VLESS params are configured"
              ;;
          esac

      # ── ۳. /stream بدون پارامتر → 400 (نه 500) ─────────────
      - name: "Stream: missing params → 400"
        run: |
          CODE=$(curl -sS -o body.txt -w '%{http_code}' --max-time 20 "$GHOST_BASE/stream" || echo 000)
          echo "status=$CODE"
          [ "$CODE" = "400" ] || { echo "::error::expected 400 for missing params, got $CODE"; exit 1; }

      # ── ۴. SSRF — هدف غیرمجاز باید رد شود ──────────────────
      - name: "Security: SSRF target containing an allowlisted hostname is rejected"
        if: env.HMAC_SECRET != ''
        run: |
          TARGET='https://example.com/?probe=googlevideo.com'
          read -r QS < <(python3 - "$TARGET" <<'PY'
import hashlib, hmac, os, sys, urllib.parse
target, seq = sys.argv[1], "0"
sig = hmac.new(os.environ["HMAC_SECRET"].encode(), f"{target}:{seq}".encode(), hashlib.sha256).hexdigest()
print("target=" + urllib.parse.quote(target, safe="") + "&sig=" + sig + "&seq=" + seq)
PY
)
          CODE=$(curl -sS -o body.txt -w '%{http_code}' --max-time 20 "$GHOST_BASE/stream?$QS" || echo 000)
          echo "status=$CODE"
          cat body.txt 2>/dev/null || true
          echo
          [ "$CODE" = "403" ] || { echo "::error::SSRF guard failed — expected 403, got $CODE"; exit 1; }
          echo "✅ hostname allowlist is anchored to the real host (no substring bypass)"

      # ── ۵. رگرسیون — هدف مجاز نباید بلاک شود ───────────────
      - name: "Regression: allowlisted target still passes the guard"
        if: env.HMAC_SECRET != ''
        run: |
          TARGET='https://www.youtube.com/robots.txt'
          read -r QS < <(python3 - "$TARGET" <<'PY'
import hashlib, hmac, os, sys, urllib.parse
target, seq = sys.argv[1], "1"
sig = hmac.new(os.environ["HMAC_SECRET"].encode(), f"{target}:{seq}".encode(), hashlib.sha256).hexdigest()
print("target=" + urllib.parse.quote(target, safe="") + "&sig=" + sig + "&seq=" + seq)
PY
)
          CODE=$(curl -sS -o body.txt -w '%{http_code}' --max-time 25 "$GHOST_BASE/stream?$QS" || echo 000)
          echo "status=$CODE"
          case "$CODE" in
            200|204|206|301|302) echo "✅ allowlisted target is not over-blocked" ;;
            *) echo "::error::allowlisted target was blocked/failed (status=$CODE)"; head -c 300 body.txt; exit 1 ;;
          esac
