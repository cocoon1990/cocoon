# ══════════════════════════════════════════════════════════════
#  CI — Rust Workers Build Check
#
#  چرا این ورک‌فلو وجود دارد؟
#  ورک‌فلوی deploy-workers فقط روی push به main اجرا می‌شود. یعنی هیچ
#  PRی این crateها را کامپایل نمی‌کند و خطاهای Rust تازه بعد از merge
#  روی main (با یک worker-build چهار دقیقه‌ای) معلوم می‌شوند.
#
#  این ورک‌فلو فقط `cargo check` می‌زند — هیچ deploy‌ای انجام نمی‌دهد.
# ══════════════════════════════════════════════════════════════
name: "🧪 CI — Rust Workers Build Check"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "signaling-worker/**"
      - "streaming-worker/**"
      - ".github/workflows/ci-workers.yml"

concurrency:
  # توجه: context‌های matrix و steps در concurrency در دسترس نیستند —
  # فقط github / inputs / vars مجاز است. استفاده از matrix.worker اینجا
  # کل فایل را نامعتبر می‌کند (GitHub آن را با نام فایل و failure ثبت می‌کند).
  group: "ci-workers-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read   # فقط خواندن — این ورک‌فلو deploy نمی‌کند

jobs:
  # ── تست منطق خالص ─────────────────────────────────────────────
  # allowlist مقصد (ضد SSRF) و ساخت URI اشتراک، تابع‌های خالص Rust‌اند
  # اما cargo test روی wasm32 اجرا نمی‌شود. این job یک پورت خط‌به‌خط
  # از همان الگوریتم را روی boundary caseها تست می‌کند.
  logic:
    name: "🐍 Logic mirror test (SSRF allowlist + VLESS URI)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run mirror test
        run: python3 scripts/test_streaming_logic.py

  check:
    name: "🦀 cargo check — ${{ matrix.worker }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        worker: [signaling-worker, streaming-worker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # ── MSRV gate (همان قاعدهٔ deploy-workers) ─────────────
      - name: Enforce crate MSRV
        working-directory: ${{ matrix.worker }}
        run: |
          REQUIRED=$(grep -E '^rust-version' Cargo.toml | head -1 | cut -d'"' -f2)
          ACTUAL=$(rustc --version | awk '{print $2}')
          echo "required=$REQUIRED actual=$ACTUAL"
          [ -n "$REQUIRED" ] || { echo "no rust-version pinned"; exit 0; }
          HIGHEST=$(printf '%s\n%s\n' "$REQUIRED" "$ACTUAL" | sort -V | tail -1)
          if [ "$HIGHEST" != "$ACTUAL" ]; then
            echo "::error::toolchain $ACTUAL is older than MSRV $REQUIRED"
            exit 1
          fi

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ matrix.worker }} -> target"
          key: "ci-${{ matrix.worker }}-${{ hashFiles(format('{0}/Cargo.toml', matrix.worker)) }}"

      - name: cargo check (wasm32-unknown-unknown)
        working-directory: ${{ matrix.worker }}
        run: |
          set -o pipefail
          cargo check --release --target wasm32-unknown-unknown 2>&1 \
            | tee "$RUNNER_TEMP/check.log"
          echo "✅ ${{ matrix.worker }} compiles"

      # ── در صورت شکست، خطای rustc را به annotation تبدیل کن ──
      - name: Surface compiler errors
        if: failure()
        run: |
          set -u
          LOG="$RUNNER_TEMP/check.log"
          OUT="$RUNNER_TEMP/surfaced.txt"
          : > "$OUT"

          if [ -f "$LOG" ]; then
            echo "size=$(wc -c < "$LOG") bytes" >> "$OUT"
            grep -a -n -E '^(error|warning: unused)' "$LOG" | head -n 20 >> "$OUT" || true
            echo "--- last 40 lines ---" >> "$OUT"
            tail -n 40 "$LOG" >> "$OUT"
          else
            echo "(no log file was written)" >> "$OUT"
          fi

          head -c 6000 "$OUT" > "$RUNNER_TEMP/trim.txt"
          [ -s "$RUNNER_TEMP/trim.txt" ] || echo "no log captured" > "$RUNNER_TEMP/trim.txt"

          MSG=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$RUNNER_TEMP/trim.txt" \
                | awk 'BEGIN{ORS=""} {print (NR>1 ? "%0A" : "") $0}')

          echo "::error title=Rust build failed (${{ matrix.worker }})::$MSG"

          echo "### ❌ ${{ matrix.worker }} failed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo '```' >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          cat "$RUNNER_TEMP/trim.txt" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo '```' >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

  # ── اجرای واقعی در workerd (بدون deploy) ───────────────────────
  # اگر worker در Mainnet با 1101 می‌میرد، اینجا استثنای واقعی چاپ
  # می‌شود. عمداً فقط برای streaming-worker و فقط روی PR.
  preview:
    name: "🔬 Local workerd run (streaming-worker)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "streaming-worker -> target"
          key: "preview"

      - name: Install worker-build
        run: cargo install worker-build --version 0.8.7 --locked

      - name: Build streaming-worker
        working-directory: streaming-worker
        run: worker-build --release

      - name: Run it in workerd and capture the exception
        run: |
          set -uo pipefail
          cd streaming-worker

          echo "npx wrangler@latest --version"; npx --yes wrangler@latest --version || true

          echo "--- build/worker ---"; ls -l build/worker/ || true
          npx --yes wrangler@latest deploy --dry-run --outdir /tmp/dry > /tmp/dry.log 2>&1 || true
          echo "--- dry-run tail ---"; tail -n 25 /tmp/dry.log || true
          echo "--- dry out ---"; ls -l /tmp/dry || true

          npx --yes wrangler@latest dev --local --port 8787 --ip 127.0.0.1 > /tmp/dev.log 2>&1 &
          DEVPID=$!
          CODES=""
          for i in $(seq 1 25); do
            sleep 2
            CODE=$(curl -sS -o /tmp/body.txt -w '%{http_code}' --max-time 5 http://127.0.0.1:8787/health || true)
            CODES="$CODES $CODE"
            echo "attempt $i -> $CODE"
            [ "$CODE" = "200" ] && break
          done
          kill $DEVPID 2>/dev/null || true
          sleep 1

          {
            echo "codes:$CODES"
            echo "--- body ---"; head -c 600 /tmp/body.txt 2>/dev/null || true
            echo "--- build/worker ---"; ls -l build/worker 2>/dev/null || true
            echo "--- dry-run summary ---"; grep -E 'Total Upload|Your Worker has access|Total' /tmp/dry.log 2>/dev/null || tail -n 12 /tmp/dry.log 2>/dev/null || true
            echo "--- dev.log (last 20) ---"; tail -n 20 /tmp/dev.log 2>/dev/null || true
          } > /tmp/report.txt

          python3 - <<'PY'
          import pathlib
          report = pathlib.Path('/tmp/report.txt').read_text(errors='replace')
          chunks = []
          cur = ''
          for line in report.splitlines():
              if len(cur) + len(line) > 900:
                  chunks.append(cur); cur = ''
              cur += line + '%0A'
          if cur: chunks.append(cur)
          for i, chunk in enumerate(chunks[:8]):
              chunk = chunk.replace('%', '%25').replace('%250A', '%0A')
              print(f"::error title=workerd-run-{i}::{chunk}")
          PY
          exit 0
      # ── آزمون قاطع: نسخهٔ 5.2.6 (last known good) را دیپلوی کن ──
      # اگر همان کدِ قبلی هم 1101 بدهد، مشکل از دیف v5.4.0 نیست و
      # پلتفرم/toolchain است. اگر ۲۰۰ بدهد، هم production برمی‌گردد و
      # هم مقصر داخل دیف است.
      - name: Deploy the last known good build (67d7009) and probe
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -uo pipefail
          R=$(mktemp -d)
          git worktree add --detach "$R/old" 67d7009231eb10b67ccc8fcf7648b770227d611e >/dev/null 2>&1
          cd "$R/old/streaming-worker"
          echo "old version: $(grep -m1 '^version' Cargo.toml)"
          npx --yes wrangler@latest deploy > /tmp/old_deploy.log 2>&1
          echo "deploy rc=$?"
          cp /tmp/old_deploy.log /tmp/probe3.txt
          sleep 15
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sS -o /tmp/body3.txt -w '%{http_code}' --max-time 15 "https://ghost-streaming-worker.cocoon-de9.workers.dev/health?cb=old-$GITHUB_RUN_ID-$i" || true)
            echo "old-build attempt $i -> $CODE" >> /tmp/probe3.txt
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          head -c 300 /tmp/body3.txt >> /tmp/probe3.txt 2>/dev/null || true
          python3 - <<'PY'
          import pathlib
          report = pathlib.Path('/tmp/probe3.txt').read_text(errors='replace')
          lines = [l for l in report.splitlines() if l.strip()]
          text = '%0A'.join(l.replace('%', '%25')[:300] for l in lines[-12:])
          print(f"::error title=old-build::{text}")
          PY
          exit 0

      # ── گرفتن استثنای واقعی با wrangler tail ────────────────────
      # health فقط «1101» می‌دهد؛ متن استثنا تنها از طریق tail می‌آید.
      - name: Capture the live exception with wrangler tail
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -uo pipefail
          ACC=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"                 https://api.cloudflare.com/client/v4/accounts                 | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['result'][0]['id'] if d.get('result') else '')")
          echo "account=${ACC:0:6}…"
          export CLOUDFLARE_ACCOUNT_ID="$ACC"

          npx --yes wrangler@latest tail ghost-streaming-worker --format json > /tmp/tail.json 2>/tmp/tail.err &
          TP=$!
          sleep 30
          curl -s -o /dev/null -w 'probe=%{http_code}\n' --max-time 15             "https://ghost-streaming-worker.cocoon-de9.workers.dev/health?cb=tail-$GITHUB_RUN_ID" || true
          sleep 12
          kill $TP 2>/dev/null || true

          python3 - <<'PY'
          import json, pathlib, re
          raw = pathlib.Path('/tmp/tail.json').read_text(errors='replace')
          err = pathlib.Path('/tmp/tail.err').read_text(errors='replace')
          lines = []
          for line in raw.splitlines():
              line = line.strip()
              if not line.startswith('{'):
                  continue
              try:
                  doc = json.loads(line)
              except Exception:
                  continue
              for exc in doc.get('exceptions', []) or []:
                  lines.append(f"EXC {exc.get('name')}: {exc.get('message')}")
              for log in doc.get('logs', []) or []:
                  msg = log.get('message')
                  if isinstance(msg, list):
                      msg = ' '.join(str(m) for m in msg)
                  lines.append(f"LOG {msg}")
              outcome = doc.get('outcome')
              if outcome and outcome != 'ok':
                  lines.append(f"OUTCOME {outcome}")
          if not lines:
              lines = ['(no tail events captured)', raw[-400:], err[-400:]]
          text = '%0A'.join(str(l).replace('%', '%25')[:500] for l in lines[:10])
          print(f"::error title=tail::{text}")
          PY
          exit 0
