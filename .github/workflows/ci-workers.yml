# ══════════════════════════════════════════════════════════════
#  CI — Rust Workers Build Check + production canary
#
#  چرا این ورک‌فلو وجود دارد؟
#  ورک‌فلوی deploy-workers فقط روی push به main اجرا می‌شود؛ یعنی هیچ PR‌ای
#  این crate‌ها را کامپایل نمی‌کند. این ورک‌فلو سه کار می‌کند:
#
#    1. logic  — تست‌های خالص (Python mirror + Node VLESS suite)
#    2. check  — cargo check روی wasm32
#    3. preview— اجرای واقعی در workerd + **canary روی رانتایم production**
#
#  canary همان artifact را با نام `ghost-streaming-canary` دیپلوی می‌کند و
#  بلافاصله پاک می‌کند. این همان تستی است که باگ 1101 نسخهٔ 5.4.0 را پیدا
#  کرد: کار کردن در workerd محلی کافی نیست، باید روی Mainnet هم ۲۰۰ بدهد.
# ══════════════════════════════════════════════════════════════
name: "🧪 CI — Rust Workers Build Check"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "signaling-worker/**"
      - "streaming-worker/**"
      - ".github/workflows/ci-workers.yml"
  push:
    branches: ["arena/ee9be859-cocoon"]
    paths:
      - "streaming-worker/**"
      - ".github/workflows/ci-workers.yml"

concurrency:
  # context‌های matrix و steps در concurrency در دسترس نیستند — فقط
  # github / inputs / vars مجاز است.
  group: "ci-workers-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── تست منطق خالص ─────────────────────────────────────────────
  logic:
    name: "🐍 Logic tests (SSRF allowlist + VLESS codec + pump)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Python mirror (allowlist + subscription URI)
        run: python3 scripts/test_streaming_logic.py

      # سرور VLESS از v5.4.1 جاوااسکریپت است، پس همین‌جا واقعاً اجرا
      # می‌شود: کدک هدر، SSRF، دست‌دادن و پمپ دوطرفه با mock.
      - name: VLESS suite (Node)
        run: node streaming-worker/tests/vless.test.mjs

  check:
    name: "🦀 cargo check — ${{ matrix.worker }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        worker: [signaling-worker, streaming-worker]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Enforce crate MSRV
        working-directory: ${{ matrix.worker }}
        run: |
          REQUIRED=$(grep -E '^rust-version' Cargo.toml | head -1 | cut -d'"' -f2)
          ACTUAL=$(rustc --version | awk '{print $2}')
          echo "required=$REQUIRED actual=$ACTUAL"
          [ -n "$REQUIRED" ] || { echo "no rust-version pinned"; exit 0; }
          HIGHEST=$(printf '%s\n%s\n' "$REQUIRED" "$ACTUAL" | sort -V | tail -1)
          if [ "$HIGHEST" != "$ACTUAL" ]; then
            echo "::error::toolchain $ACTUAL is older than MSRV $REQUIRED"
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ matrix.worker }} -> target"
          key: "ci-${{ matrix.worker }}-${{ hashFiles(format('{0}/Cargo.toml', matrix.worker)) }}"

      - name: cargo check (wasm32-unknown-unknown)
        working-directory: ${{ matrix.worker }}
        run: |
          set -o pipefail
          cargo check --release --target wasm32-unknown-unknown 2>&1 | tee "$RUNNER_TEMP/check.log"
          echo "✅ ${{ matrix.worker }} compiles"

      - name: Surface compiler errors
        if: failure()
        run: |
          set -u
          LOG="$RUNNER_TEMP/check.log"
          OUT="$RUNNER_TEMP/surfaced.txt"
          : > "$OUT"
          if [ -f "$LOG" ]; then
            echo "size=$(wc -c < "$LOG") bytes" >> "$OUT"
            grep -a -n -E '^(error|warning: unused)' "$LOG" | head -n 20 >> "$OUT" || true
            echo "--- last 40 lines ---" >> "$OUT"
            tail -n 40 "$LOG" >> "$OUT"
          else
            echo "(no log file was written)" >> "$OUT"
          fi
          head -c 6000 "$OUT" > "$RUNNER_TEMP/trim.txt"
          [ -s "$RUNNER_TEMP/trim.txt" ] || echo "no log captured" > "$RUNNER_TEMP/trim.txt"
          MSG=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$RUNNER_TEMP/trim.txt" \
                | awk 'BEGIN{ORS=""} {print (NR>1 ? "%0A" : "") $0}')
          echo "::error title=Rust build failed (${{ matrix.worker }})::$MSG"

  # ── workerd + canary روی رانتایم production ────────────────────
  preview:
    name: "🔬 workerd + production canary (streaming-worker)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "streaming-worker -> target"
          key: "preview"

      - name: Install worker-build
        run: cargo install worker-build --version 0.8.7 --locked

      - name: Build streaming-worker
        working-directory: streaming-worker
        run: worker-build --release

      - name: "workerd (local): /health + /vless + /sub"
        working-directory: streaming-worker
        run: |
          set -uo pipefail
          npx --yes wrangler@latest dev --local --port 8787 --ip 127.0.0.1 > /tmp/dev.log 2>&1 &
          DEVPID=$!
          CODE=000
          for _ in $(seq 1 30); do
            sleep 2
            CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 5 http://127.0.0.1:8787/health || true)
            [ "$CODE" = "200" ] && break
          done
          SUB=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8787/sub || true)
          VLESS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8787/vless || true)
          kill $DEVPID 2>/dev/null || true
          sleep 1

          echo "health=$CODE sub=$SUB vless=$VLESS"
          head -c 200 /tmp/health.json || true
          tail -n 10 /tmp/dev.log || true

          [ "$CODE" = "200" ] || { echo "::error title=workerd /health::got $CODE"; exit 1; }
          grep -q '"worker":"ghost-streaming"' /tmp/health.json || { echo "::error title=workerd /health::unexpected body"; exit 1; }
          [ "$VLESS" = "426" ] || [ "$VLESS" = "503" ] || { echo "::error title=workerd /vless::got $VLESS"; exit 1; }
          [ "$SUB" = "200" ] || [ "$SUB" = "503" ] || { echo "::error title=workerd /sub::got $SUB"; exit 1; }

      # ── canary: همان artifact روی رانتایم production ────────────
      - name: Canary deploy on the production runtime
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: streaming-worker
        run: |
          set -uo pipefail
          sed -e '1s/.*/name = "ghost-streaming-canary"/' wrangler.toml > wrangler.canary.toml
          trap 'npx --yes wrangler@latest delete --name ghost-streaming-canary --force >/dev/null 2>&1 || true' EXIT

          npx --yes wrangler@latest deploy -c wrangler.canary.toml 2>&1 | tee /tmp/canary.log

          HOST=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/canary.log | head -1)
          [ -n "$HOST" ] || { echo "::error title=canary::could not read the deployed URL"; exit 1; }
          echo "canary: $HOST"

          CODE=000
          for attempt in $(seq 1 8); do
            sleep 10
            CODE=$(curl -sS -o /tmp/canary.json -w '%{http_code}' --max-time 15 "$HOST/health?cb=$GITHUB_RUN_ID-$attempt" || echo 000)
            echo "attempt $attempt -> HTTP $CODE"
            [ "$CODE" = "200" ] && break
          done

          head -c 300 /tmp/canary.json || true
          [ "$CODE" = "200" ] || { echo "::error title=canary /health::production runtime returned $CODE"; exit 1; }
          grep -q '"worker":"ghost-streaming"' /tmp/canary.json || { echo "::error title=canary body::unexpected payload"; exit 1; }

          VLESS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$HOST/vless?cb=$GITHUB_RUN_ID" || echo 000)
          echo "canary /vless -> $VLESS"
          [ "$VLESS" = "426" ] || [ "$VLESS" = "503" ] || { echo "::error title=canary /vless::got $VLESS"; exit 1; }

          echo "queue_total=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$HOST/sub" || echo 000)" || true
