# ══════════════════════════════════════════════════════════════
#  CI — Rust Workers Build Check
#
#  چرا این ورک‌فلو وجود دارد؟
#  ورک‌فلوی deploy-workers فقط روی push به main اجرا می‌شود. یعنی هیچ
#  PRی این crateها را کامپایل نمی‌کند و خطاهای Rust تازه بعد از merge
#  روی main (با یک worker-build چهار دقیقه‌ای) معلوم می‌شوند.
#
#  این ورک‌فلو فقط `cargo check` می‌زند — هیچ deploy‌ای انجام نمی‌دهد.
# ══════════════════════════════════════════════════════════════
name: "🧪 CI — Rust Workers Build Check"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "signaling-worker/**"
      - "streaming-worker/**"
      - ".github/workflows/ci-workers.yml"

concurrency:
  # توجه: context‌های matrix و steps در concurrency در دسترس نیستند —
  # فقط github / inputs / vars مجاز است. استفاده از matrix.worker اینجا
  # کل فایل را نامعتبر می‌کند (GitHub آن را با نام فایل و failure ثبت می‌کند).
  group: "ci-workers-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read   # فقط خواندن — این ورک‌فلو deploy نمی‌کند

jobs:
  # ── تست منطق خالص ─────────────────────────────────────────────
  # allowlist مقصد (ضد SSRF) و ساخت URI اشتراک، تابع‌های خالص Rust‌اند
  # اما cargo test روی wasm32 اجرا نمی‌شود. این job یک پورت خط‌به‌خط
  # از همان الگوریتم را روی boundary caseها تست می‌کند.
  logic:
    name: "🐍 Logic mirror test (SSRF allowlist + VLESS URI)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run mirror test
        run: python3 scripts/test_streaming_logic.py

  check:
    name: "🦀 cargo check — ${{ matrix.worker }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        worker: [signaling-worker, streaming-worker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # ── MSRV gate (همان قاعدهٔ deploy-workers) ─────────────
      - name: Enforce crate MSRV
        working-directory: ${{ matrix.worker }}
        run: |
          REQUIRED=$(grep -E '^rust-version' Cargo.toml | head -1 | cut -d'"' -f2)
          ACTUAL=$(rustc --version | awk '{print $2}')
          echo "required=$REQUIRED actual=$ACTUAL"
          [ -n "$REQUIRED" ] || { echo "no rust-version pinned"; exit 0; }
          HIGHEST=$(printf '%s\n%s\n' "$REQUIRED" "$ACTUAL" | sort -V | tail -1)
          if [ "$HIGHEST" != "$ACTUAL" ]; then
            echo "::error::toolchain $ACTUAL is older than MSRV $REQUIRED"
            exit 1
          fi

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ matrix.worker }} -> target"
          key: "ci-${{ matrix.worker }}-${{ hashFiles(format('{0}/Cargo.toml', matrix.worker)) }}"

      - name: cargo check (wasm32-unknown-unknown)
        working-directory: ${{ matrix.worker }}
        run: |
          set -o pipefail
          cargo check --release --target wasm32-unknown-unknown 2>&1 \
            | tee "$RUNNER_TEMP/check.log"
          echo "✅ ${{ matrix.worker }} compiles"

      # ── در صورت شکست، خطای rustc را به annotation تبدیل کن ──
      - name: Surface compiler errors
        if: failure()
        run: |
          set -u
          LOG="$RUNNER_TEMP/check.log"
          OUT="$RUNNER_TEMP/surfaced.txt"
          : > "$OUT"

          if [ -f "$LOG" ]; then
            echo "size=$(wc -c < "$LOG") bytes" >> "$OUT"
            grep -a -n -E '^(error|warning: unused)' "$LOG" | head -n 20 >> "$OUT" || true
            echo "--- last 40 lines ---" >> "$OUT"
            tail -n 40 "$LOG" >> "$OUT"
          else
            echo "(no log file was written)" >> "$OUT"
          fi

          head -c 6000 "$OUT" > "$RUNNER_TEMP/trim.txt"
          [ -s "$RUNNER_TEMP/trim.txt" ] || echo "no log captured" > "$RUNNER_TEMP/trim.txt"

          MSG=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$RUNNER_TEMP/trim.txt" \
                | awk 'BEGIN{ORS=""} {print (NR>1 ? "%0A" : "") $0}')

          echo "::error title=Rust build failed (${{ matrix.worker }})::$MSG"

          echo "### ❌ ${{ matrix.worker }} failed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo '```' >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          cat "$RUNNER_TEMP/trim.txt" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo '```' >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

  # ── اجرای واقعی در workerd (بدون deploy) ───────────────────────
  # اگر worker در Mainnet با 1101 می‌میرد، اینجا استثنای واقعی چاپ
  # می‌شود. عمداً فقط برای streaming-worker و فقط روی PR.
  preview:
    name: "🔬 Local workerd run (streaming-worker)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "streaming-worker -> target"
          key: "preview"

      - name: Install worker-build
        run: cargo install worker-build --version 0.8.7 --locked

      - name: Build streaming-worker
        working-directory: streaming-worker
        run: worker-build --release

      - name: Run it in workerd and capture the exception
        run: |
          set -uo pipefail
          cd streaming-worker

          echo "npx wrangler@latest --version"; npx --yes wrangler@latest --version || true

          echo "--- build/worker ---"; ls -l build/worker/ || true
          npx --yes wrangler@latest deploy --dry-run --outdir /tmp/dry > /tmp/dry.log 2>&1 || true
          echo "--- dry-run tail ---"; tail -n 25 /tmp/dry.log || true
          echo "--- dry out ---"; ls -l /tmp/dry || true

          npx --yes wrangler@latest dev --local --port 8787 --ip 127.0.0.1 > /tmp/dev.log 2>&1 &
          DEVPID=$!
          CODES=""
          for i in $(seq 1 25); do
            sleep 2
            CODE=$(curl -sS -o /tmp/body.txt -w '%{http_code}' --max-time 5 http://127.0.0.1:8787/health || true)
            CODES="$CODES $CODE"
            echo "attempt $i -> $CODE"
            [ "$CODE" = "200" ] && break
          done
          kill $DEVPID 2>/dev/null || true
          sleep 1

          {
            echo "codes:$CODES"
            echo "--- body ---"; head -c 600 /tmp/body.txt 2>/dev/null || true
            echo "--- build/worker ---"; ls -l build/worker 2>/dev/null || true
            echo "--- dry-run summary ---"; grep -E 'Total Upload|Your Worker has access|Total' /tmp/dry.log 2>/dev/null || tail -n 12 /tmp/dry.log 2>/dev/null || true
            echo "--- dev.log (last 20) ---"; tail -n 20 /tmp/dev.log 2>/dev/null || true
          } > /tmp/report.txt

          python3 - <<'PY'
          import pathlib
          report = pathlib.Path('/tmp/report.txt').read_text(errors='replace')
          chunks = []
          cur = ''
          for line in report.splitlines():
              if len(cur) + len(line) > 900:
                  chunks.append(cur); cur = ''
              cur += line + '%0A'
          if cur: chunks.append(cur)
          for i, chunk in enumerate(chunks[:8]):
              chunk = chunk.replace('%', '%25').replace('%250A', '%0A')
              print(f"::error title=workerd-run-{i}::{chunk}")
          PY
          exit 0
      # ── دیپلوی همین build + probe (حلقهٔ تشخیص سریع) ───────────
      - name: Deploy this build and probe production
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -u
          OUT=/tmp/probe.txt
          : > "$OUT"
          trap 'python3 - "$OUT" <<"PY"
          import pathlib, sys
          lines = [l for l in pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines() if l.strip()]
          body = "%0A".join(l.replace("%", "%25")[:300] for l in lines[-10:])
          print(f"::error title=probe::{body}")
          PY' EXIT

          cd streaming-worker
          npx --yes wrangler@latest deploy >> "$OUT" 2>&1
          echo "deploy rc=$?" >> "$OUT"
          sleep 20
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sS -o /tmp/b.txt -w '%{http_code}' --max-time 15 "https://ghost-streaming-worker.cocoon-de9.workers.dev/health?cb=$GITHUB_RUN_ID-$i" || true)
            echo "probe $i -> $CODE" >> "$OUT"
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          head -c 200 /tmp/b.txt >> "$OUT" 2>/dev/null || true
          exit 0

      # ══ پروب ماتریسی: محیط سالم است یا artifact؟ ═════════════════
      # ۱) یک worker خالص JS: اگر این هم 1101 بدهد → مشکل حساب/لبه است.
      - name: Probe A — minimal JS worker (environment sanity)
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -u
          mkdir -p /tmp/jsprobe && cd /tmp/jsprobe
          printf 'export default { async fetch() { return new Response("js-ok"); } };\n' > probe.mjs
          printf 'name = "ghost-js-probe"\nmain = "probe.mjs"\ncompatibility_date = "2025-10-01"\nworkers_dev = true\n' > wrangler.toml
          npx --yes wrangler@latest deploy > deploy.log 2>&1
          echo "deploy rc=$?" >> deploy.log
          sleep 25
          CODE=$(curl -sS -o body.txt -w '%{http_code}' --max-time 15 "https://ghost-js-probe.cocoon-de9.workers.dev/?cb=$GITHUB_RUN_ID" || true)
          MSG="A js-probe -> HTTP $CODE | body=$(head -c 80 body.txt | tr '\n' ' ')%0Adeploy: $(tail -n 4 deploy.log | tr '\n' ' ' | cut -c1-260)"
          echo "::error title=probe-A-js::$MSG"

      # ۲) مینیمال‌ترین worker ممکن با همان toolchain راست (همان worker 0.8.7).
      #    اگر این سالم باشد، کد برنامه مقصر است، نه ابزار.
      - name: Probe B — minimal Rust worker (same toolchain)
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -u
          mkdir -p /tmp/rsprobe/src && cd /tmp/rsprobe
          printf '[package]\nname = "rsprobe"\nversion = "0.1.0"\nedition = "2021"\n\n[lib]\ncrate-type = ["cdylib"]\n\n[dependencies]\nworker = { version = "0.8.7" }\n\n[profile.release]\nopt-level = "z"\nlto = "fat"\ncodegen-units = 1\npanic = "abort"\n' > Cargo.toml
          printf 'use worker::*;\n\n#[event(fetch)]\npub async fn main(_req: Request, _env: Env, _ctx: Context) -> Result<Response> {\n    Response::ok("rs-ok")\n}\n' > src/lib.rs
          printf 'name = "ghost-rs-probe"\nmain = "build/worker/shim.mjs"\ncompatibility_date = "2025-10-01"\n\n[build]\ncommand = "worker-build --release"\n' > wrangler.toml
          worker-build --release > build.log 2>&1
          echo "build rc=$? size=$(wc -c < build/worker/shim.wasm 2>/dev/null || echo 0)" >> build.log
          npx --yes wrangler@latest deploy >> build.log 2>&1
          echo "deploy rc=$?" >> build.log
          sleep 25
          CODE=$(curl -sS -o body.txt -w '%{http_code}' --max-time 15 "https://ghost-rs-probe.cocoon-de9.workers.dev/?cb=$GITHUB_RUN_ID" || true)
          MSG="B rs-probe -> HTTP $CODE | body=$(head -c 80 body.txt | tr '\n' ' ')%0A$(grep -E 'build rc|deploy rc|error' build.log | tail -n 3 | tr '\n' ' ' | cut -c1-240)"
          echo "::error title=probe-B-rust::$MSG"

      # ══ چه ماژول‌هایی import می‌شوند؟ ═════════════════════════════
      - name: Dump bundle imports
        if: always()
        continue-on-error: true
        run: |
          set -u
          cd streaming-worker
          npx --yes wrangler@latest deploy --dry-run --outdir /tmp/dry >/dev/null 2>&1 || true
          echo "--- shim.mjs imports ---"
          grep -oE 'from ?"[^"]+"' build/worker/shim.mjs 2>/dev/null | sort -u || echo none
          echo "--- bundle imports ---"
          grep -ohE 'from ?"[^":]+:[^"]+"' /tmp/dry/*.js 2>/dev/null | sort -u || echo none
          echo "--- files ---"
          ls -l build/worker/ | head -6
          exit 0

      # ══ بایسکت کد/وابستگی‌ها — هر variant جدا deploy می‌شود ═════════
      - name: Probe V1 (no d1 feature) + V2 (minimal main)
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -u
          cd streaming-worker
          OUT=/tmp/v.txt; : > "$OUT"
          cp src/lib.rs /tmp/lib.real.rs
          cp Cargo.toml /tmp/Cargo.real.toml

          deploy_probe() { # $1=name
            printf 'name = "%s"\nmain = "build/worker/shim.mjs"\ncompatibility_date = "2025-10-01"\n' "$1" > "wrangler.$1.toml"
            set +e
            npx --yes wrangler@latest deploy -c "wrangler.$1.toml" > "/tmp/v-$1.log" 2>&1
            RC=$?
            set -e
            sleep 18
            CODE=$(curl -sS -o "/tmp/v-$1.body" -w '%{http_code}' --max-time 15               "https://$1.cocoon-de9.workers.dev/health?cb=$GITHUB_RUN_ID" || true)
            printf '%s: deploy_rc=%s health=%s body=%s\n' "$1" "$RC" "$CODE"               "$(head -c 50 "/tmp/v-$1.body" 2>/dev/null | tr '\n' ' ')" >> "$OUT"
          }

          # ── V1: بدون feature d1
          sed -i 's/features = \["d1"\]/features = []/' Cargo.toml
          grep -n '^worker' Cargo.toml >> "$OUT" || true
          worker-build --release > /tmp/v1-build.log 2>&1 || echo "V1 build FAILED" >> "$OUT"
          deploy_probe ghost-v1-nod1
          cp /tmp/Cargo.real.toml Cargo.toml

          # ── V2: همان کد، ولی main فقط "v2" برمی‌گرداند
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('src/lib.rs')
          lines = p.read_text().splitlines(True)
          start = next(i for i, l in enumerate(lines) if l.startswith('#[event(fetch)]'))
          end = next(i for i in range(start + 1, len(lines)) if lines[i].rstrip() in ('}', '} '))
          stub = (
              '#[event(fetch)]\n'
              'pub async fn main(_req: Request, _env: Env, _ctx: Context) -> Result<Response> {\n'
              '    Response::ok("v2")\n'
              '}\n'
          )
          p.write_text(''.join(lines[:start]) + stub + ''.join(lines[end + 1:]))
          PY
          worker-build --release > /tmp/v2-build.log 2>&1 || echo "V2 build FAILED" >> "$OUT"
          deploy_probe ghost-v2-minmain
          cp /tmp/lib.real.rs src/lib.rs

          rm -f wrangler.ghost-*.toml
          MSG=$(sed -e 's/%/%25/g' "$OUT" | awk 'BEGIN{ORS=""} {print (NR>1 ? "%0A" : "") $0}' | cut -c1-850)
          echo "::error title=probe-V::$MSG"
