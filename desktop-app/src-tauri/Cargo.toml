[package]
name = "scp-ghost-desktop"
version = "5.2.6"
description = "SCP-GHOST desktop companion — X25519 session + signed streaming requests"
authors = ["cocoon1990"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── HTTPS client (blocking; keeps the async surface tiny) ──────
ureq = { version = "2", features = ["json"] }

# ── رمزنگاری — دقیقاً همان الگوریتم‌های browser-wasm/signaling-worker ──
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
zeroize = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
