[package]
name = "scp-ghost-desktop"
version = "5.4.1"
description = "SCP-GHOST desktop shell — drives the meow proxy core as a sidecar"
authors = ["cocoon1990"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri، sidecar و به‌روزرسانی درون‌برنامه‌ای ──────────────────
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# native-tls (SChannel روی ویندوز): بدون زنجیرهٔ ring/rustls -> بدون
# نیاز به cmake/nasm در CI. `zip` برای بسته‌های آپدیت لازم است.
tauri-plugin-updater = { version = "2", default-features = false, features = [
  "native-tls",
  "zip",
] }

# ── سریال‌سازی پاسخ دستورها ────────────────────────────────────
# serde_json به‌صورت مستقیم لازم است: ماکروی `#[tauri::command]` برای
# دستورهای async آرگومان‌ها را از همین مسیر دی‌کد می‌کند.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# هیچ کلاینت HTTP و هیچ سوکتی در این crate نیست: اشتراک با fetch خودِ
# webview گرفته می‌شود و همهٔ ترافیک تونل کار sidecar است.

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
