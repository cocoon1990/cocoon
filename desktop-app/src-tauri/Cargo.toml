[package]
name = "scp-ghost-desktop"
version = "5.3.0"
description = "SCP-GHOST desktop controller — drives the meow proxy core as a sidecar"
authors = ["cocoon1990"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri و sidecar ────────────────────────────────────────────
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

# ── سریال‌سازی پاسخ دستورها ────────────────────────────────────
serde = { version = "1", features = ["derive"] }

# ── تنها شبکهٔ این crate: یک GET ساده برای متن اشتراک ─────────
# (نه پراکسی، نه TUN، نه سوکت خام — همهٔ آن‌ها کار sidecar است)
ureq = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
